[package]
name = "xtask"
description = "The project's own tooling: gates, renaming, timings. Standard library only, so it builds in a second."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# What is tested as functions and not by running the program (`changes`).
# All tests live in tests/suite.
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"
