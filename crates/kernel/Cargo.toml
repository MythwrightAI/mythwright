[package]
name = "kernel"
description = "Types every layer shares: events, principals, errors, ids, the clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
