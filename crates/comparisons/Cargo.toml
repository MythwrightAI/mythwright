[package]
name = "comparisons"
description = "One blueprint started several ways, side by side: the ways and their shares, what a way reads instead, and what came of each thing counted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
blueprint = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
runs = { workspace = true }
conductor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
blocks = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
