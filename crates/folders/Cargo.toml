[package]
name = "folders"
description = "A factory's data folder, worked on as files: who has it, what it is called, the factories beside it, a copy of it and a factory started from one, a project moved to a journal of its own, the database written out again, a project's own blueprints as a layer of the library, where a blueprint's text stands among those that ship, and the factory started again by a step of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# What it does is driven through the daemon, whose suite plays every
# piece of it (a copy, an arrival, a move, a repack, a folder held), so
# it has no suite of its own.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
runs = { workspace = true }
conductor = { workspace = true }
comparisons = { workspace = true }
hosting = { workspace = true }
studio = { workspace = true }
agents = { workspace = true }
topics = { workspace = true }
gateway = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
