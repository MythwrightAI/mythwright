[package]
name = "blocks"
description = "The building blocks that are nobody's but the runner's to offer: who a pool gives a place to, a text put together from parts, the variables of the environment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
blueprint = { workspace = true }
kernel = { workspace = true }
conductor = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
journal = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
