[package]
name = "texts"
description = "Which text something running goes on with: where texts are found, what a text reaches, what a tree is held to, what was vouched for, and how a changed one is come by."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
runs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
