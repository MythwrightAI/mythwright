[package]
name = "trash"
description = "The Trash for whoever reads it: what was deleted that they could read, given back and deleted for good by whoever could have deleted it, and emptied once it has been there as long as the factory keeps what is deleted. The writes that move a thing in and out are the studio's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
conductor = { workspace = true }
hosting = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
runs = { workspace = true }
studio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
blueprint = { workspace = true }
talk = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
