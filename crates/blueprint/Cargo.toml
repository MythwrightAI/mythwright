[package]
name = "blueprint"
description = "The blueprint language: parse, check and project to a graph. Pure; no I/O, no runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
reader = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
