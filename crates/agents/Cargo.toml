[package]
name = "agents"
description = "Agent slots: where an agent lives, what it may do, and how its turns are run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
conductor = { workspace = true }
environments = { workspace = true }
hosting = { workspace = true }
link = { workspace = true }
studio = { workspace = true }
deciding = { workspace = true }
topics = { workspace = true }
extensions = { workspace = true }
places = { workspace = true }
told = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
blocks = { workspace = true }
# Whether a program a test started is still there, asked of the system
# where it keeps no file that says (the suite alone asks).
sysinfo = { workspace = true }

# The stand-in for a program that the tests start: `hosting`'s, the one
# source file, as a program of this crate, so that cargo builds it with
# this suite and tells the suite where it is. Nothing in `src/` starts
# it, and nothing that packages or installs copies it.
[[bin]]
name = "agents-standin"
path = "../hosting/standin/main.rs"
test = false
doctest = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"
