[package]
name = "extensions"
description = "Extension packages: what a package says (its program, its actions, the blueprints it brings, what it shows of a repository, how its program signs in and what it needs behind a wall), and how one turn of its program is run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# What a package does once it is installed is played through the agents'
# suite; this suite holds what is of a manifest alone.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
kernel = { workspace = true }
conductor = { workspace = true }
hosting = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
