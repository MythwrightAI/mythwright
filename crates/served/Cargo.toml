[package]
name = "served"
description = "What the daemon serves over HTTP beside the routes of its API, and what every request is held to before a route is looked at: the client's files, the names it answers to, what is sent past what a route takes, a library's pages, mockups and the store program."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# Its tests are the API suite's (`client.rs`, `guarded.rs`, `sent.rs`,
# `stores.rs` and those beside them), which ask a node over HTTP, and the
# command line's, which run the store as a program of its own.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
windowed = { workspace = true }
studio = { workspace = true }
conductor = { workspace = true }
hosting = { workspace = true }
folders = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
