[package]
name = "windowed"
description = "A table's rows read from the database a window at a time, as plain values: a row as the record it is, what a window is asked and comes to, and the reading over a connection by each way a window is planned."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite.
test = false
doctest = false

[dependencies]
journal = { workspace = true }
kernel = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
