[package]
name = "environments"
description = "What a blueprint reads of where it runs that somebody said: the factory's variables, kept and held for every conductor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
blueprint = { workspace = true }
brand = { workspace = true }
kernel = { workspace = true }
journal = { workspace = true }
runs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
