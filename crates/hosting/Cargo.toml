[package]
name = "hosting"
description = "Runs things on this device: commands, long-lived services, and the router in front of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# All tests live in tests/suite. Compiling the library a second time in test
# mode was the single largest rustc invocation on the previous codebase.
test = false
doctest = false

[dependencies]
brand = { workspace = true }
blueprint = { workspace = true }
environments = { workspace = true }
kernel = { workspace = true }
link = { workspace = true }
journal = { workspace = true }
conductor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

# The stand-in for a program that the tests start (`standin/main.rs`
# says what it is). It is a program of this crate so that cargo builds it
# with the suite and tells the suite where it is; it is the standard
# library alone, is started by nothing in `src/`, and is copied by
# nothing that packages or installs.
[[bin]]
name = "hosting-standin"
path = "standin/main.rs"
test = false
doctest = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"
